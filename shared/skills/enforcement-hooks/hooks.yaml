# Modula engine extension — NOT part of the Agent Skills standard.
# Declares deterministic, lifecycle-bound enforcement applied by Modula's runner/verifier,
# harness-agnostic. The adapter may delegate to a native hook where the harness exposes one
# (Claude Code), but correctness never depends on the harness providing it.
#
# action: inject | block | warn
# event:  session-start | pre-compaction | pre-write | pre-commit | pre-tool | stop
# Only BINARY, judgment-free rules belong here; anything needing judgment stays a gate.

schema_version: 1
skill: enforcement-hooks

hooks:
  - id: reinject-doctrine
    intent: Keep the active doctrine present after compaction and in long sessions.
    event: [session-start, pre-compaction]
    action: inject
    payload: condensed summary of enabled skills' load-bearing rules
    default: on

  - id: secret-write-guard
    intent: A file containing a credential is never written.
    event: [pre-write, pre-tool]
    action: block
    default: on
    pairs_with: security-per-pr#secrets     # prevention at write time; detection at review time

  - id: commit-format-guard
    intent: Commit messages are conventional-commits form with no forbidden tool/author attribution.
    event: pre-commit
    action: block
    default: on
    pairs_with: house-conventions

  - id: file-size-guard
    intent: Files stay under the size default unless a cohesive unit justifies exceeding it.
    event: pre-write
    action: warn                             # block only when a project opts into hard enforcement
    default: warn
    escape_hatch: KISS — a cohesive unit may exceed with a stated reason

  - id: variant-file-guard
    intent: Iteration-residue filenames (*_v2/_old/_backup/_copy) are never created.
    event: [pre-write, pre-tool]
    action: block
    default: on
    pairs_with: machine-lint-pack#variant-files

  - id: periodic-nudge
    intent: Remind to update memory / re-check the plan / record decisions.
    event: stop
    cadence: every-nth
    action: warn
    default: off

  - id: lightweight-judgment
    intent: A narrow high-frequency check a regex is too blunt for, routed through a cheap model.
    event: [pre-commit, pre-tool]
    action: warn                             # advises, not blocks — the one non-deterministic hook
    default: off

# Enforcement is engine-side because hooks do not port (Agent Skills standard: allowed-tools /
# disable-model-invocation / hooks are Claude-only). See SKILL.md "why this tier is engine-side".
