# Modula engine extension — NOT part of the Agent Skills standard.
# The verifier reads this; the coder reads SKILL.md. They ship together so the
# generation overlay and the enforced gates cannot diverge ("one selection, two consumers").
#
# severity:     blocking | advisory   (advisory graduates to blocking once its FP rate is measured)
# applies_when: predicate over the change's detected surface — a gate fires only where it holds
# capability:   an intent name resolved to a concrete tool by the language-adapter registry
#               (see capability_bindings) — never a tool or language named in a gate

schema_version: 1
skill: security-per-pr

surfaces:
  # Predicates the adapter evaluates against the change; referenced by applies_when.
  always: true
  has_dependencies: "manifest or lockfile present or changed"
  request_handling: "code registers routes/handlers or reads request input"
  service: "process exposes a network or IPC service surface"
  web: "surface speaks HTTP to a browser or public client"
  high_risk: "change touches authentication, authorization, payments, a data model, a new external endpoint, cryptography, file upload, or deserialization"

gates:
  - id: secrets
    intent: No credential is committed or reachable in the change's history.
    capability: secrets-scanner
    severity: blocking
    applies_when: always
    evidence: [file, line_or_commit, detector_rule]
    remediation: Remove the secret, rotate it, and load it from the secret store.

  - id: dependency-vulnerabilities
    intent: No added or present dependency carries a known high/critical advisory.
    capability: dep-vuln-auditor
    severity: blocking            # high + critical only; lower severities are advisory
    threshold: [high, critical]
    applies_when: has_dependencies
    evidence: [package, version, advisory_id, severity]
    remediation: Upgrade past the advisory, or replace the dependency.

  - id: injection
    intent: Untrusted input cannot reach an interpreter (SQL/NoSQL/command/template/LDAP/path/XSS).
    capability: sast-scanner
    requires: cross-file-taint    # source->sink can cross files/functions; a single-file engine (Semgrep CE) misses it
    on_unsupported: report-unavailable   # if no cross-file-taint engine is bound, report the gate unavailable — never a false clean
    severity: blocking            # high-confidence reachable findings; heuristic hits are advisory
    confidence_floor: high
    applies_when: always
    evidence: [source, sink, dataflow_path]
    remediation: Parameterize / use the framework-safe API; validate at the boundary.

  - id: authz-bypass
    intent: Protected operations check identity and object-level permission.
    capability: authz-check
    severity: advisory            # graduates once precise
    applies_when: request_handling
    evidence: [endpoint_or_handler, missing_check]
    remediation: Add the authN/authZ check, including object-level ownership.

  - id: error-leakage
    intent: Errors returned to callers leak no stack trace, path, SQL, or internal id.
    capability: sast-scanner
    severity: advisory
    applies_when: service
    evidence: [handler_or_response_path, leaked_detail_class]
    remediation: Return a safe message; send detail to logs only.

  - id: security-headers
    intent: HTTPS enforced and baseline headers present (HSTS, CSP, X-Content-Type-Options, X-Frame-Options).
    capability: header-check
    severity: advisory
    applies_when: web
    evidence: [surface, missing_header]
    remediation: Set the header at the framework/proxy layer.

  - id: exposed-routes
    intent: No admin/debug/introspection surface is unintentionally public.
    capability: route-exposure
    severity: advisory
    applies_when: web
    evidence: [path, auth_state]
    remediation: Put it behind auth, or disable it in production.

# Risk-triggered ceiling above the always-on seven. Read-only analysis producing a threat table,
# never a code edit. Runs isolated (Claude context:fork) or inline (fallback) — same output.
threat_model:
  method: STRIDE
  reference: references/stride.md
  applies_when: high_risk
  high_risk_surfaces: [authentication, authorization, payments, data-model, new-external-endpoint, cryptography, file-upload, deserialization]
  output: threat-table            # threat | category | asset | mitigation-present? | action
  routing: gate-mapped-findings-through-their-gate; ungated-findings-to-coder; trade-offs-to-human

# Egress contract is GLOBAL, not per-tool: every binding below — default AND alternate — runs
# under this profile. No binding may enable remote validators, telemetry, or DB auto-update.
# (Generalizes the per-binding grype profile; closes the semgrep-secrets validator egress path.)
binding_profile:
  offline: true
  network: denied
  remote_validators: disabled   # e.g. semgrep-secrets token validators MUST be off — they POST detected tokens
  telemetry: disabled
  db: pinned                    # no scan-time auto-update (grype/trivy)

# capability -> concrete tooling. The adapter picks the binding for the detected ecosystem,
# preferring genuinely multi-language tools so the doctrine holds for any language/app type.
# `default` is the shipped choice; `alternate` is a supported swap.
capability_bindings:
  secrets-scanner:
    default: gitleaks
    alternate: [semgrep-secrets, xgrep]
  dep-vuln-auditor:
    default: grype
    alternate: [trivy, semgrep-supply-chain]
    profile: {offline: true, db: pinned, network: denied}   # egress contract (FRD): pin the vuln DB, no db.auto-update at scan time, deny network
  sast-scanner:
    default: semgrep           # with the Pro engine (offline) for cross-file taint — required by the injection gate; plain Semgrep CE is single-file and NOT eligible for injection
    alternate: [xgrep]         # single binary with cross-file taint, offline
    requires: cross-file-taint
  authz-check:
    default: agent-judgment     # route/handler inventory + judgment; dynamic probe where a running surface exists
  header-check:
    default: agent-judgment
    alternate: [dynamic-probe]
  route-exposure:
    default: agent-judgment
    alternate: [dynamic-probe]
